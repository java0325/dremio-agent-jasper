services:
  sample-postgres:
    image: postgres:16-alpine
    container_name: sample-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dremio_user
      POSTGRES_PASSWORD: dremio_pass
      POSTGRES_DB: sample_sales
    ports:
      - "5432:5432"
    volumes:
      - ./sample-db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dremio_user -d sample_sales"]
      interval: 5s
      timeout: 5s
      retries: 10
