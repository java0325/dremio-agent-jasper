services:
  sample-postgres:
    image: postgres:16-alpine
    container_name: sample-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dremio_user
      POSTGRES_PASSWORD: dremio_pass
      POSTGRES_DB: sample_sales
    ports:
      - "5431:5432"
    volumes:
      - ./sample-db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dremio_user -d sample_sales"]
      interval: 5s
      timeout: 5s
      retries: 10

  dremio-agent:
    image: dremio/dremio-oss
    container_name: dremio-agent
    restart: unless-stopped
    ports:
      - "9046:9047"
      - "31009:31010"
      - "45677:45678"
    volumes:
      - dremio_agent_data:/opt/dremio/data
    depends_on:
      sample-postgres:
        condition: service_healthy

volumes:
  dremio_agent_data:
